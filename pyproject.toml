[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commandagi"
version = "0.1.0"
description = "Official Python SDK for commandAGI — Command the AGI with taste"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "commandAGI", email = "hello@commandagi.com" },
]
keywords = ["commandagi", "ai", "annotation", "taste", "human-feedback", "rlhf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://commandagi.com"
Repository = "https://github.com/commandAGI/commandagi-python"
Issues = "https://github.com/commandAGI/commandagi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["commandagi"]

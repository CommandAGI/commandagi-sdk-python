[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commandagi"
# Single source of truth: commandagi/__init__.py `__version__` (read by hatchling at build time).
dynamic = ["version"]
description = "The CommandAGI SDK for Python — agent threads, memory and integrations, and live computers, robots and simulated worlds you watch and control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CommandAGI" }]
keywords = ["robotics", "simulation", "reinforcement-learning", "agents", "physics", "computer-use"]
dependencies = [
    "requests>=2.28",
    "websocket-client>=1.5",
]

[project.optional-dependencies]
# For Session.observe_array() — decode frames to numpy arrays.
vision = ["numpy>=1.23", "pillow>=9.0"]
# Gymnasium env wrapper (commandagi.gym_env) — the standard RL reset/step loop over a sim.
gym = ["gymnasium>=0.29", "numpy>=1.23", "pillow>=9.0"]
# LeRobot-style dataset recording (commandagi.lerobot) — record demonstrations/rollouts.
lerobot = ["pyarrow>=14.0", "numpy>=1.23", "pillow>=9.0"]

[project.urls]
Homepage = "https://commandagi.com"
Documentation = "https://github.com/CommandAGI/commandagi-sdk-python/blob/main/README.md"

[tool.hatch.version]
path = "commandagi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["commandagi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commandagi"
version = "0.1.0"
description = "Python SDK for CommandAGI — launch cloud computers and 3D robot simulations and control them programmatically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CommandAGI" }]
keywords = ["robotics", "simulation", "reinforcement-learning", "agents", "pybullet", "computer-use"]
dependencies = [
    "requests>=2.28",
    "websocket-client>=1.5",
]

[project.optional-dependencies]
# For World.observe_array() — decode frames to numpy arrays.
vision = ["numpy>=1.23", "pillow>=9.0"]

[project.urls]
Homepage = "https://commandagi.com"
Documentation = "https://github.com/commandAGI/commandagi/blob/main/docs/ROBOT_DEVELOPER_API.md"

[tool.hatch.build.targets.wheel]
packages = ["commandagi"]
